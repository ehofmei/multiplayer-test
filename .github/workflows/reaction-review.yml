name: Reaction Race review
on:
  push:
    branches: [codex/reaction-polish]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Refresh deliberately centered Linux Breakout victory pose
        run: npx playwright test tests/breakout.spec.ts --grep 'paired Breakout teammates' --update-snapshots=all
      - name: Return reviewed-state Linux renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/breakout.spec.ts-snapshots/*-linux.png
          if ! git diff --cached --quiet; then
            git commit -m 'Centered Linux Breakout victory baseline'
            git push origin HEAD:codex/reaction-polish
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
