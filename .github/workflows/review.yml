name: Game lab review
on:
  push:
    # Historical review branches keep their own workflows without duplicate runs.
    branches:
      - "codex/**"
      - "!codex/arena-pong-polish"
      - "!codex/bakery-polish"
      - "!codex/breakout-reaction-space"
      - "!codex/breakout-snapshot-stability"
      - "!codex/decision-deadlines"
      - "!codex/family-playtest-boards"
      - "!codex/glow-clash"
      - "!codex/glow-rewards"
      - "!codex/light-seek"
      - "!codex/minigolf-art"
      - "!codex/minigolf-layout"
      - "!codex/picnic-polish"
      - "!codex/pong-bumpers"
      - "!codex/portrait-pong"
      - "!codex/reaction-polish"
      - "!codex/ship-controls"
      - "!codex/sumo-artwork"
      - "!codex/sumo-controls"
      - "!codex/sumo-feedback"
      - "!codex/treasure-expedition"
  workflow_dispatch:
    inputs:
      mode:
        description: "Baseline generation is evidence only; verify the final commit separately"
        type: choice
        options: [verify, baselines]
        default: verify
      specs:
        description: "Baseline mode only: space-separated existing tests/*.spec.ts files"
        type: string
      benchmark:
        description: "Compare normal verification against two browser shards"
        type: boolean
        default: false
      refresh:
        description: "Deliberately refresh existing images after reviewing mismatches"
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}-${{ inputs.mode || 'verify' }}
  cancel-in-progress: true
jobs:
  verify:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Complete final verification (no snapshot updates)
        if: inputs.mode != 'baselines'
        run: npm run verify
      - name: Build for scoped baseline generation only
        if: inputs.mode == 'baselines'
        run: npm run build
      - name: Obtain genuine Ubuntu images (not final verification)
        if: inputs.mode == 'baselines'
        env:
          QA_BASELINE_SPECS: ${{ inputs.specs }}
          QA_BASELINE_REFRESH: ${{ inputs.refresh }}
        run: node scripts/generate-review-baselines.mjs
      - name: Save requested baseline evidence
        if: inputs.mode == 'baselines' && success()
        uses: actions/upload-artifact@v7
        with:
          name: linux-baseline-evidence-${{ github.sha }}
          path: test-results/linux-baseline-evidence/
          retention-days: 7
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save compact timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-timing-${{ github.sha }}
          path: test-results/*timing.json
          if-no-files-found: ignore
          retention-days: 7

  benchmark:
    # An explicit review-commit marker also allows a first run before dispatch
    # is available on the default branch. Ordinary final verification omits it.
    if: startsWith(github.ref, 'refs/heads/codex/') && (inputs.benchmark || contains(github.event.head_commit.message, '[benchmark]'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:fast
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --update-snapshots=none
      - run: npm run check:snapshots
      - name: Save shard timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-timing-${{ matrix.shard }}-${{ github.sha }}
          path: test-results/*timing.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save shard failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-failures-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
