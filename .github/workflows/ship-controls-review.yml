name: Spaceship controls review
on:
  push:
    branches: [codex/ship-controls]
concurrency:
  group: ship-controls-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Refresh reviewed library description baselines once
        run: npx playwright test tests/app-layout.spec.ts --grep 'home, paged library' --update-snapshots=all
      - name: Return Linux library renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/app-layout.spec.ts-snapshots/app-library-linux.png tests/app-layout.spec.ts-snapshots/app-home-linux.png
          if ! git diff --cached --quiet; then
            git commit -m 'Updated Linux Spaceship library description'
            git push origin HEAD:codex/ship-controls
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
