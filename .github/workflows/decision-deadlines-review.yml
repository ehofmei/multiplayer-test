name: Decision deadlines review
on:
  push:
    branches: [codex/decision-deadlines]
  workflow_dispatch:
concurrency:
  group: decision-deadlines-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Obtain intended Linux deadline changes once
        run: |
          if [ ! -f tests/decision-deadlines-linux-reviewed.txt ]; then
            npx playwright test tests/minigolf.spec.ts tests/treasure.spec.ts tests/picnic.spec.ts --update-snapshots=all
            echo 'Generated decision-deadline Linux renders; review before final verification.' > tests/decision-deadlines-linux-reviewed.txt
          fi
      - name: Return Linux renders to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/minigolf.spec.ts-snapshots/*-linux.png tests/treasure.spec.ts-snapshots/*-linux.png tests/picnic.spec.ts-snapshots/*-linux.png tests/decision-deadlines-linux-reviewed.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Generated Linux decision baselines'
            git push origin HEAD:codex/decision-deadlines
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
