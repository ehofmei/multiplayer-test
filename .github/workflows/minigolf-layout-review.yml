name: Minigolf layout review
on:
  push:
    branches: [codex/minigolf-layout]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Generate intended upright-flag Linux renders once
        run: npx playwright test tests/minigolf.spec.ts --grep 'Golf pairs' --update-snapshots=all
      - name: Return reviewed-branch Linux renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/minigolf.spec.ts-snapshots/*-linux.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generated upright-flag Linux baselines'
            git push origin HEAD:codex/minigolf-layout
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
