name: Minigolf cup and results review
on:
  push:
    branches: [codex/minigolf-layout]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Obtain genuine Linux cup and results baselines once
        run: |
          if [ ! -f tests/minigolf-results.spec.ts-snapshots/golf-winner-phone-linux.png ]; then
            npx playwright test tests/minigolf-results.spec.ts --update-snapshots
            npx playwright test tests/minigolf.spec.ts --update-snapshots=all
          fi
      - name: Return Linux cup and results renders to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/minigolf-results.spec.ts-snapshots/*-linux.png tests/minigolf.spec.ts-snapshots/*-linux.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generated Linux cup and results baselines'
            git push origin HEAD:codex/minigolf-layout
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
