name: Treasure Linux snapshot QA
on:
  push:
    branches: [codex/treasure-snapshot-qa]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/treasure.spec.ts --update-snapshots
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treasure-linux-baselines
          path: |
            tests/treasure.spec.ts-snapshots/
            test-results/
          retention-days: 7
