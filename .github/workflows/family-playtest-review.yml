name: Family playtest review
on:
  push:
    branches: [codex/family-playtest-boards]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
