name: Arena Pong review
on:
  push:
    branches: [codex/arena-pong-polish]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Obtain genuine Linux baselines once
        run: |
          if [ ! -f tests/arena.spec.ts-snapshots/arena-ready-linux.png ]; then
            npx playwright test tests/arena.spec.ts --update-snapshots
          fi
      - name: Return Linux renders to the review branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d tests/arena.spec.ts-snapshots ]; then
            git add tests/arena.spec.ts-snapshots/*-linux.png
          fi
          mkdir -p docs/screenshots
          for state in ready-320x568-taller active-844x390-taller; do
            if [ -f "test-results/arena-$state.png" ]; then
              cp "test-results/arena-$state.png" "docs/screenshots/arena-$state-linux.png"
              git add "docs/screenshots/arena-$state-linux.png"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Generated Linux Arena Pong baselines'
            git push origin HEAD:codex/arena-pong-polish
          fi
      - run: npm run verify
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
